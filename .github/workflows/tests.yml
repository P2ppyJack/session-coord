name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.11", "3.13"]
        exclude:
          # macos-latest is arm64; no 3.8 builds published
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: skill bundle layout + frontmatter (official Hermes skill contract)
        run: |
          python3 - <<'EOF'
          import pathlib, re
          root = pathlib.Path("skills/multi-session-coordination")
          skill = root / "SKILL.md"
          assert skill.exists(), "skills/multi-session-coordination/SKILL.md missing"
          for sub in ("references", "templates", "scripts", "examples"):
              assert (root / sub).is_dir(), "skill bundle missing " + sub
          content = skill.read_text(encoding="utf-8")
          assert content.startswith("---"), "frontmatter must start at byte 0"
          m = re.search(r"\n---\s*\n", content[3:])
          fm = content[3:m.start() + 3]
          keys = dict(re.findall(r"^([a-z_]+):\s*(.*)$", fm, re.M))
          for field in ("name", "description", "version", "author", "license", "platforms"):
              assert keys.get(field), "frontmatter missing " + field
          desc = keys["description"].strip().strip('"').strip()
          assert len(desc) <= 60, "description > 60 chars (house hardline)"
          assert desc.rstrip().endswith("."), "description must end with a period"
          assert keys["name"] == "multi-session-coordination", "name mismatch"
          for ref in re.findall(r"`(references|templates|scripts|examples)/[^`]+`", content):
              assert (root / ref).exists(), "SKILL.md references missing file: " + ref
          assert "/Users/" not in content and "/home/" not in content, "machine-local path in SKILL.md"
          print("skill bundle OK: frontmatter + layout + references valid")
          EOF
      - name: v1 regression suite (28 checks)
        run: bash skills/multi-session-coordination/scripts/selftest.sh
      - name: v2 priority/fencing/lineage suite (26 checks)
        run: bash skills/multi-session-coordination/scripts/selftest_priority.sh
      - name: v2.1 cron-leg + v2.2 bot-leg suite (45 checks)
        run: bash skills/multi-session-coordination/scripts/selftest_cron.sh
      - name: v2.3 master-switch toggle suite (28 checks)
        run: bash skills/multi-session-coordination/scripts/selftest_toggle.sh
      - name: installer smoke test (install + self-verify into a scratch home)
        run: python3 install.py --dest "$RUNNER_TEMP/coord/scripts" --state-dir "$RUNNER_TEMP/coord/state" --skill-dest "$RUNNER_TEMP/coord/skills/multi-session-coordination"
      - name: installer skill bundle lands + is idempotent
        run: |
          SKILLD="$RUNNER_TEMP/coord/skills/multi-session-coordination"
          [ -f "$SKILLD/SKILL.md" ] || { echo "SKILL.md not installed"; exit 1; }
          [ -f "$SKILLD/references/publishing-and-ci.md" ] || { echo "references not installed"; exit 1; }
          [ -f "$SKILLD/templates/bot-soul-coordination.md" ] || { echo "templates not installed"; exit 1; }
          [ -f "$SKILLD/examples/memory-entry.example.md" ] || { echo "examples not installed"; exit 1; }
          python3 install.py --dest "$RUNNER_TEMP/coord/scripts" --state-dir "$RUNNER_TEMP/coord/state" --skill-dest "$SKILLD" > /dev/null
          [ "$(find "$SKILLD" -name '*.bak-*' | wc -l)" -eq 0 ] || { echo "re-run created backups — not idempotent"; exit 1; }
      - name: installer wiring is idempotent (re-run + exactly one marker)
        run: |
          MEM="$RUNNER_TEMP/coord-mem/MEMORY.md"
          mkdir -p "$(dirname "$MEM")"
          python3 install.py --dest "$RUNNER_TEMP/coord/scripts" --state-dir "$RUNNER_TEMP/coord/state" --memory-file "$MEM" --skill-dest "$RUNNER_TEMP/coord/skills/multi-session-coordination"
          python3 install.py --dest "$RUNNER_TEMP/coord/scripts" --state-dir "$RUNNER_TEMP/coord/state" --memory-file "$MEM" --skill-dest "$RUNNER_TEMP/coord/skills/multi-session-coordination"
          [ "$(grep -c 'session-coord (wire v1)' "$MEM")" -eq 1 ]

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: bandit (security)
        run: pipx run bandit skills/multi-session-coordination/scripts/session_coord.py install.py
      - name: ruff (strict profile, line-length 100)
        run: pipx run ruff check --select E,F,W,I,UP,SIM,ISC,RUF,B --line-length 100 skills/multi-session-coordination/scripts/session_coord.py install.py
      - name: shellcheck (guard + wrappers + selftests)
        run: shellcheck skills/multi-session-coordination/scripts/coord_guard.sh skills/multi-session-coordination/examples/wrapper.example.sh skills/multi-session-coordination/scripts/selftest_toggle.sh
